# Static content deployment workflow for Vite React App on GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master" depending on your default branch name
  workflow_dispatch:

# Set environment variables for the entire workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grant GITHUB_TOKEN write access to trigger Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci || (echo "npm ci failed, falling back to npm install" && npm install)

      - name: Build static files
        run: npm run build

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v4

      - name: Upload distribution artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
